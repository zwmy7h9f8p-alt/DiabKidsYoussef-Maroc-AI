name: Temporary Ciqual 2025 transfer

on:
  push:
    branches:
      - temp-ciqual-2025-transfer
    paths:
      - .github/workflows/fetch-ciqual-transfer.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fetch-ciqual-transfer.yml

permissions:
  contents: read

jobs:
  fetch-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify official Ciqual 2025 workbook
        shell: bash
        run: |
          set -euo pipefail
          URL='https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/RPWYZD'
          curl -L --fail --retry 5 --retry-all-errors -o '/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx' "$URL"
          test "$(md5sum '/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx' | awk '{print $1}')" = '0d9758ce23f3f13dd63a005bc1bb4f2c'
          sha256sum '/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx'
          stat -c '%n %s bytes' '/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx'

      - name: Upload verified workbook
        uses: actions/upload-artifact@v4
        with:
          name: ciqual-2025-original
          path: /tmp/Table Ciqual 2025_FR_2025_11_03.xlsx
          if-no-files-found: error
          retention-days: 1
