name: Temporary Ciqual 2025 NLLB fast translation

on:
  push:
    branches:
      - temp-ciqual-2025-transfer
    paths:
      - .github/workflows/fetch-ciqual-transfer.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fetch-ciqual-transfer.yml

permissions:
  contents: read

jobs:
  translate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and verify official Ciqual 2025 workbook
        shell: bash
        run: |
          set -euo pipefail
          URL='https://entrepot.recherche.data.gouv.fr/api/access/datafile/:persistentId?persistentId=doi:10.57745/RPWYZD'
          curl -L --fail --retry 5 --retry-all-errors -o '/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx' "$URL"
          test "$(md5sum '/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx' | awk '{print $1}')" = '0d9758ce23f3f13dd63a005bc1bb4f2c'

      - name: Install translation dependencies
        run: |
          python -m pip install --quiet --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install --quiet 'transformers<5' sentencepiece pandas openpyxl accelerate safetensors

      - name: Translate all French labels with fast NLLB decoding
        shell: bash
        run: |
          cat > /tmp/translate_ciqual_nllb.py <<'PY'
          import json
          import re
          from pathlib import Path
          import pandas as pd
          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          source = Path('/tmp/Table Ciqual 2025_FR_2025_11_03.xlsx')
          sheets = pd.read_excel(source, sheet_name=None, dtype=object)
          comp = sheets['composition nutritionnelle']
          infoods = sheets['codes INFOODS']
          texts = []
          for col in ['alim_grp_nom_fr', 'alim_ssgrp_nom_fr', 'alim_ssssgrp_nom_fr', 'alim_nom_fr']:
              for value in comp[col].dropna().tolist():
                  s = re.sub(r'\s+', ' ', str(value)).strip()
                  if s and s != '-': texts.append(s)
          for value in infoods['const_nom_fr'].dropna().tolist():
              s = re.sub(r'\s+', ' ', str(value)).strip()
              if s and s != '-': texts.append(s)
          texts = list(dict.fromkeys(texts))

          model_name = 'facebook/nllb-200-distilled-600M'
          tokenizer = AutoTokenizer.from_pretrained(model_name, src_lang='fra_Latn')
          model = AutoModelForSeq2SeqLM.from_pretrained(model_name, low_cpu_mem_usage=True)
          model.eval()
          torch.set_num_threads(4)
          forced_bos = tokenizer.convert_tokens_to_ids('arb_Arab')
          translations = {}
          batch_size = 24
          with torch.inference_mode():
              for start in range(0, len(texts), batch_size):
                  batch = texts[start:start+batch_size]
                  enc = tokenizer(batch, return_tensors='pt', padding=True, truncation=True, max_length=160)
                  out = model.generate(**enc, forced_bos_token_id=forced_bos, num_beams=1, max_new_tokens=180)
                  arabic = tokenizer.batch_decode(out, skip_special_tokens=True)
                  for fr, ar in zip(batch, arabic):
                      translations[fr] = re.sub(r'\s+', ' ', ar).strip()
                  print(f'{min(start+batch_size, len(texts))}/{len(texts)}', flush=True)
          payload = {
              'model': model_name,
              'source_language': 'fra_Latn',
              'target_language': 'arb_Arab',
              'decoding': 'greedy',
              'source_md5': '0d9758ce23f3f13dd63a005bc1bb4f2c',
              'count': len(translations),
              'translations': translations,
          }
          Path('/tmp/ciqual_fr_ar_nllb_fast.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          python /tmp/translate_ciqual_nllb.py

      - name: Upload verified source and fast NLLB translations
        uses: actions/upload-artifact@v4
        with:
          name: ciqual-2025-source-and-arabic-nllb-fast
          path: |
            /tmp/Table Ciqual 2025_FR_2025_11_03.xlsx
            /tmp/ciqual_fr_ar_nllb_fast.json
          if-no-files-found: error
          retention-days: 1
